# error-convention.conf - per-library configuration for
# check-error-convention.sh (CONVENTIONS.md section 14).
#
# Columns (whitespace separated):
#   dir          library directory, relative to the repository root
#   prefix       required symbol/header prefix (foo89)
#   status_type  public status enum name, or - when the library has none
#   profile      portable | posix
#   names        yes when foo89_status_name/message are required
#   ordinary     grep -E alternation of extra ordinary-outcome tokens, or -
. datalog89 datalog89_status portable yes -
